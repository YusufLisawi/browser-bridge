<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1d2226;
        --muted: #6b7280;
        --line: #ececec;
        --chip: #f4f5f7;
        --ok: #1a7f37;
        --bad: #c62828;
        --warn: #b26a00;
        --accent: #0a66c2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1f24;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --line: #2c3138;
          --chip: #262b31;
          --ok: #4ade80;
          --bad: #f87171;
          --warn: #fbbf24;
          --accent: #4ea1f0;
        }
      }
      * { box-sizing: border-box; }
      body {
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        width: 340px;
        margin: 0;
        padding: 0;
        color: var(--fg);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 13px 14px 11px;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        width: 20px; height: 20px; border-radius: 5px;
        background: var(--accent);
        display: grid; place-items: center;
        color: #fff; font-weight: 700; font-size: 12px;
        flex: none;
      }
      h1 { font-size: 13.5px; font-weight: 600; margin: 0; flex: 1; }
      .body { padding: 12px 14px 14px; }
      .status {
        display: flex; align-items: center; gap: 9px;
        padding: 9px 11px;
        border-radius: 9px;
        background: var(--chip);
      }
      .dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--muted); flex: none;
        box-shadow: 0 0 0 3px transparent;
      }
      .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
      .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 22%, transparent); }
      .dot.warn { background: var(--warn); }
      .dot.live { animation: pulse 1.1s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      .status .label { font-weight: 600; }
      .status .sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
      .status .txt { display: flex; flex-direction: column; }
      .meta { margin: 11px 1px 0; display: flex; flex-direction: column; gap: 6px; }
      .meta .row { display: flex; justify-content: space-between; gap: 10px; }
      .meta .k { color: var(--muted); }
      .meta .v { text-align: right; }
      code {
        background: var(--chip); padding: 1px 5px; border-radius: 5px;
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .feed, .autos { margin-top: 13px; }
      .feed h2, .autos h2 {
        font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
        color: var(--muted); margin: 0 0 6px; font-weight: 600;
      }
      ul { list-style: none; margin: 0; padding: 0; }
      li.job {
        display: flex; align-items: baseline; gap: 7px;
        padding: 4px 0; border-top: 1px solid var(--line);
      }
      li.job:first-child { border-top: none; }
      .mark { flex: none; font-size: 11px; line-height: 1.5; }
      .mark.ok { color: var(--ok); }
      .mark.bad { color: var(--bad); }
      .job .kind { font-weight: 600; flex: none; }
      .job .detail {
        color: var(--muted); flex: 1; min-width: 0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .job .when { color: var(--muted); flex: none; font-size: 11px; }
      .empty { color: var(--muted); font-size: 12px; padding: 2px 0; }
      .err {
        margin-top: 10px; padding: 7px 9px; border-radius: 8px;
        background: color-mix(in srgb, var(--bad) 12%, transparent);
        color: var(--bad); font-size: 11.5px; white-space: pre-wrap;
      }
      .site {
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
      }
      .site:first-child { margin-top: 0; }
      .site-h {
        padding: 6px 9px;
        background: var(--chip);
        font-weight: 600;
        font-size: 12px;
      }
      .auto {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 9px;
        border-top: 1px solid var(--line);
      }
      .auto .info { flex: 1; min-width: 0; }
      .auto .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .auto .desc {
        color: var(--muted); font-size: 11.5px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      button.run, button.cancel {
        flex: none;
        border: 0;
        border-radius: 6px;
        padding: 5px 10px;
        font: inherit;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
      }
      button.run { background: var(--accent); color: #fff; }
      button.run:disabled { opacity: .45; cursor: default; }
      button.cancel { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
      .runbox {
        margin-top: 8px;
        padding: 8px 9px;
        border-radius: 8px;
        background: var(--chip);
        font-size: 11.5px;
      }
      .runbox .ttl { font-weight: 600; margin-bottom: 3px; }
      .runbox .step { color: var(--muted); word-break: break-all; }
      .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
      details.feed {
        margin-top: 13px;
      }
      details.feed > summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10.5px;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
        user-select: none;
        margin: 0 0 6px;
      }
      details.feed > summary::-webkit-details-marker { display: none; }
      details.feed > summary .chev {
        display: inline-block;
        font-size: 9px;
        transition: transform .12s ease;
        transform: rotate(-90deg);
      }
      details.feed[open] > summary .chev { transform: rotate(0deg); }
      details.feed > summary .count {
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
        opacity: .85;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="logo">B</span>
      <h1>Browser Bridge</h1>
    </header>
    <div class="body">
      <div class="status">
        <span id="dot" class="dot"></span>
        <span class="txt">
          <span id="label" class="label">Checking…</span>
          <span id="sub" class="sub"></span>
        </span>
      </div>

      <div class="meta">
        <div class="row"><span class="k">Socket</span><span class="v"><code>ws://127.0.0.1:38471</code></span></div>
        <div class="row"><span class="k">Target tab</span><span class="v" id="tab">—</span></div>
        <div class="row"><span class="k">Last command</span><span class="v" id="last">—</span></div>
        <div class="row"><span class="k">Capture</span><span class="v" id="capture">off</span></div>
      </div>

      <div class="autos">
        <h2>Automations</h2>
        <div id="autos"><div class="empty">No automations synced yet.</div></div>
        <div id="runbox" class="runbox" style="display:none"></div>
        <p class="hint">Sync from CLI: <code>bridge auto sync</code></p>
      </div>

      <details class="feed" id="feedWrap">
        <summary>
          <span class="chev">▾</span>
          Recent activity
          <span class="count" id="feedCount"></span>
        </summary>
        <ul id="feed"><li class="empty">No commands yet.</li></ul>
      </details>

      <div id="err" class="err" style="display:none"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
